# The trading bot: ONE run at a time checks every 30 seconds during market hours (see .github/scripts/trade_loop.sh).
# Each run idles outside market hours and starts the next run itself before GitHub's 6-hour cap, so the chain never
# depends on GitHub's schedule (which skips and delays runs). The schedule below is only a backup to restart the chain.
name: trader

on:
  schedule:
    - cron: "0,20,40 12-20 * * 1-5"
  workflow_dispatch:
    inputs:
      test_minutes:
        description: "Test only: run the loop for this many minutes even if the market is closed"
        required: false
        default: ""

concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write   # save the account and publish live numbers
      actions: write    # start the next run when this one nears GitHub's 6-hour limit
    env:
      GH_TOKEN: ${{ github.token }}
      TEST_MINUTES: ${{ inputs.test_minutes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the scanner's math libraries
        run: pip install --quiet numpy pandas

      - name: Check every 30 seconds while the market is open
        run: bash .github/scripts/trade_loop.sh
